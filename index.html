<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><title>Mi Economía</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--muted:#657484;--accent:#1769aa;--line:#e1e7ed;--green:#17834b;--red:#c43c43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif}header{background:#102a43;color:white;padding:20px 16px 16px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:23px}header p{margin:3px 0 0;color:#c9d8e4;font-size:13px}.wrap{max-width:850px;margin:auto;padding:14px 14px 90px}.nav{display:flex;overflow:auto;gap:7px;margin:12px 0}.nav button{white-space:nowrap;border:0;border-radius:30px;background:#e3eaf1;color:#23384c;padding:10px 14px;font-weight:600}.nav button.active{background:#1769aa;color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 2px 5px #1231}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.metric small{display:block;color:var(--muted);margin-bottom:7px}.metric strong{font-size:20px}.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted);font-size:13px}h2{font-size:20px;margin:10px 0}h3{font-size:17px;margin:4px 0 12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.month{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.month button{width:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .wide{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;min-width:0;padding:11px;border:1px solid #ccd6df;border-radius:10px;background:white;color:#17212b}button{border:1px solid #ccd6df;background:white;color:#17212b;border-radius:10px;padding:10px;cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650}.danger{color:var(--red)}.listitem{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.listitem:last-child{border:0}.listitem .desc{min-width:0;overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-shrink:0}.actions button{padding:7px 9px;font-size:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{border:1px solid var(--line);border-radius:8px;min-height:70px;padding:5px;overflow:hidden;background:white;font-size:12px}.day.today{border:2px solid var(--accent)}.day .item{font-size:10px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:3px}.dayhead{text-align:center;color:var(--muted);font-size:12px;padding:4px}.badge{font-size:11px;padding:3px 7px;border-radius:8px;background:#edf2f6;color:#4b6175}.empty{text-align:center;color:var(--muted);padding:20px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modalbox{background:white;border-radius:18px;padding:18px;max-width:500px;width:100%;max-height:90vh;overflow:auto}.modalbox h3{margin-top:0}.close{float:right}.checks{display:flex;gap:10px;align-items:center}.checks input{width:auto}.small{font-size:12px}@media(max-width:440px){.wrap{padding:10px 10px 90px}.formgrid{grid-template-columns:1fr 1fr}.day{min-height:58px;padding:3px}.day .item{font-size:9px}.metric strong{font-size:17px}.listitem{align-items:flex-start}.actions{flex-direction:column}.month strong{font-size:15px}}
</style></head>
<body><header><h1>💰 Mi Economía</h1><p>Tu dinero, claro y organizado</p></header><main class="wrap">
<div class="nav" id="nav"></div><div id="app"></div><div class="footer">Datos guardados en este dispositivo · Haz una copia de seguridad periódicamente</div></main><div id="modal"></div>
<script>
(()=> {
const KEY='mi_economia_mobile_v3';
const base=[
{name:'Nómina',amount:1353,type:'income',category:'Ingresos',day:1,start:'2026-11',freq:'monthly',end:''},
{name:'Hipoteca',amount:211.80,type:'expense',category:'Vivienda',day:1,start:'2026-11',freq:'monthly',end:''},
{name:'Préstamo coche',amount:205,type:'expense',category:'Financiación',day:1,start:'2026-11',freq:'monthly',end:'2027-08'},
{name:'Comunidad',amount:65,type:'expense',category:'Vivienda',day:5,start:'2026-11',freq:'monthly',end:''},
{name:'Luz',amount:65,type:'expense',category:'Hogar',day:10,start:'2026-11',freq:'monthly',end:''},
{name:'Seguro vida',amount:14,type:'expense',category:'Seguros',day:12,start:'2026-11',freq:'monthly',end:''},
{name:'Seguro hogar',amount:21,type:'expense',category:'Seguros',day:12,start:'2026-11',freq:'monthly',end:''},
{name:'Seguro coche',amount:32,type:'expense',category:'Transporte',day:15,start:'2026-11',freq:'monthly',end:''},
{name:'IBI casa',amount:13,type:'expense',category:'Vivienda',day:15,start:'2026-11',freq:'monthly',end:''},
{name:'IVTM coche',amount:12,type:'expense',category:'Transporte',day:15,start:'2026-11',freq:'monthly',end:''},
{name:'Suscripciones',amount:31,type:'expense',category:'Suscripciones',day:18,start:'2026-11',freq:'monthly',end:''},
{name:'ORA residente',amount:3,type:'expense',category:'Transporte',day:20,start:'2026-11',freq:'monthly',end:''},
{name:'ITV prorrateada',amount:8,type:'expense',category:'Transporte',day:20,start:'2026-11',freq:'monthly',end:''},
{name:'Gasolina',amount:100,type:'expense',category:'Transporte',day:22,start:'2026-11',freq:'monthly',end:''},
{name:'Alimentación',amount:300,type:'expense',category:'Alimentación',day:25,start:'2026-11',freq:'monthly',end:''},
{name:'Boxeo',amount:20,type:'expense',category:'Deporte',day:5,start:'2026-11',freq:'monthly',end:''},
{name:'Nutricionista',amount:60,type:'expense',category:'Salud',day:5,start:'2026-11',freq:'monthly',end:''},
{name:'Gimnasio',amount:55,type:'expense',category:'Deporte',day:5,start:'2026-11',freq:'every2',end:''}
].map((x,i)=>({...x,id:'r'+(i+1)}));
let d;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!d)d={rec:base,moves:[],initial:0};
if(!Array.isArray(d.rec))d.rec=base;if(!Array.isArray(d.moves))d.moves=[];if(d.initial==null)d.initial=0;
let tab='home',cur=new Date(),selectedDay=null;
const month=()=>cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
const fmt=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Math.random().toString(36).slice(2,9);
function save(){localStorage.setItem(KEY,JSON.stringify(d));render()}
function active(r,m){return m>=r.start&&(!r.end||m<=r.end)}
function occurs(r,m){if(!active(r,m))return false;if(r.freq==='every2'){let a=Number(r.start.slice(5,7)),b=Number(m.slice(5,7));let diff=(Number(m.slice(0,4))-Number(r.start.slice(0,4)))*12+(b-a);return diff%2===0}return true}
function recurFor(m){return d.rec.filter(r=>occurs(r,m))}
function calc(m){let rs=recurFor(m),ms=d.moves.filter(x=>x.date.slice(0,7)===m);let inc=rs.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0)+ms.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0);let exp=rs.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)+ms.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);return{inc,exp,bal:inc-exp,fix:rs.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)}}
function nav(){let names={home:'Resumen',moves:'Movimientos',calendar:'Calendario',rec:'Pagos fijos',budget:'Categorías'};document.querySelector('#nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function monthCtl(){return `<div class="month"><button id="prev">◀</button><strong>${cur.toLocaleString('es-ES',{month:'long',year:'numeric'})}</strong><button id="next">▶</button></div>`}
function bindMonth(){document.querySelector('#prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};document.querySelector('#next').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()}}
function metrics(m){let t=calc(m);return `<div class="cards"><div class="metric"><small>Ingresos</small><strong class="pos">${fmt(t.inc)}</strong></div><div class="metric"><small>Gastos</small><strong class="neg">${fmt(t.exp)}</strong></div><div class="metric"><small>Saldo mensual</small><strong class="${t.bal>=0?'pos':'neg'}">${fmt(t.bal)}</strong></div><div class="metric"><small>Pagos fijos</small><strong>${fmt(t.fix)}</strong></div></div>`}
function moveForm(){return `<div class="card"><h3>Nuevo movimiento</h3><form id="moveForm"><div class="formgrid"><select name="type"><option value="expense">Gasto</option><option value="income">Ingreso</option></select><input name="amount" type="number" min=".01" step=".01" placeholder="Importe €" required><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required><input name="category" placeholder="Categoría" required><input class="wide" name="desc" placeholder="Descripción (opcional)"></div><button class="primary" style="width:100%;margin-top:10px">Añadir movimiento</button></form></div>`}
function recForm(rec){let r=rec||{};return `<div class="card"><h3>${r.id?'Editar pago':'Nuevo pago periódico'}</h3><form id="recForm"><input type="hidden" name="id" value="${esc(r.id||'')}"><div class="formgrid"><input name="name" placeholder="Concepto" value="${esc(r.name||'')}" required><input name="amount" type="number" min=".01" step=".01" placeholder="Importe €" value="${r.amount??''}" required><select name="type"><option value="expense" ${r.type!=='income'?'selected':''}>Gasto</option><option value="income" ${r.type==='income'?'selected':''}>Ingreso</option></select><select name="category">${['Vivienda','Financiación','Transporte','Seguros','Suscripciones','Alimentación','Hogar','Deporte','Salud','Ingresos','Ocio','Otros'].map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select><input name="day" type="number" min="1" max="31" placeholder="Día del mes" value="${r.day??1}" required><input name="start" type="month" value="${r.start||month()}" required><select name="freq"><option value="monthly" ${r.freq!=='every2'?'selected':''}>Cada mes</option><option value="every2" ${r.freq==='every2'?'selected':''}>Cada 2 meses</option></select><input name="end" type="month" value="${r.end||''}" placeholder="Fecha fin"></div><small class="muted">Fecha de fin opcional. Periodicidad mensual o cada dos meses.</small><div class="row" style="margin-top:10px"><button type="button" id="cancelEdit">Cancelar</button><button class="primary">${r.id?'Guardar cambios':'Añadir'}</button></div></form></div>`}
function movesList(m){let arr=d.moves.filter(x=>x.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));return arr.length?`<div class="card">${arr.map(x=>`<div class="listitem"><div class="desc"><b>${esc(x.desc||x.category)}</b><div class="muted">${esc(x.date)} · ${esc(x.category)}</div></div><div class="actions"><b class="${x.type==='income'?'pos':'neg'}">${x.type==='income'?'+':'−'}${fmt(x.amount)}</b><button data-editm="${x.id}">Editar</button><button class="danger" data-delm="${x.id}">×</button></div></div>`).join('')}</div>`:`<div class="card empty">Sin movimientos anotados este mes.</div>`}
function backupControls(){return `<div class="card"><h3>Copias de seguridad</h3><div class="row"><button id="export">Exportar copia</button><button id="importbtn">Importar copia</button><button class="danger" id="reset">Restaurar datos iniciales</button></div><input type="file" id="importfile" accept="application/json" class="hidden"><small class="muted">Exporta un JSON para conservar tus datos o recuperarlos en otro dispositivo.</small></div>`}
function recList(){return d.rec.length?`<div class="card">${d.rec.map(r=>`<div class="listitem"><div class="desc"><b>${esc(r.name)}</b><div class="muted">${esc(r.category)} · Día ${r.day} · ${r.freq==='every2'?'Cada 2 meses':'Mensual'} · ${r.start}${r.end?' – '+r.end:' · sin fin'}</div><span class="badge">${r.type==='income'?'Ingreso':'Gasto'}</span></div><div class="actions"><b class="${r.type==='income'?'pos':'neg'}">${fmt(r.amount)}</b><button data-editrec="${r.id}">Editar</button><button class="danger" data-delr="${r.id}">×</button></div></div>`).join('')}</div>`:`<div class="card empty">No tienes pagos recurrentes.</div>`}
function calendarView(){let m=month(),first=(new Date(cur.getFullYear(),cur.getMonth(),1).getDay()+6)%7,days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),html=['L','M','X','J','V','S','D'].map(x=>`<div class="dayhead">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div></div>';for(let day=1;day<=days;day++){let ds=m+'-'+String(day).padStart(2,'0'),items=[];recurFor(m).filter(r=>Number(r.day)===day).forEach(r=>items.push({name:r.name,amt:r.amount,type:r.type}));d.moves.filter(x=>x.date===ds).forEach(x=>items.push({name:x.desc||x.category,amt:x.amount,type:x.type}));html+=`<div class="day ${ds===new Date().toISOString().slice(0,10)?'today':''}"><b>${day}</b>${items.map(x=>`<span class="item ${x.type==='income'?'pos':'neg'}">${x.type==='income'?'+':'−'}${fmt(x.amt)} ${esc(x.name)}</span>`).join('')}</div>`}return `<div class="card"><div class="calendar">${html}</div><p class="muted">Verde: ingresos · Rojo: gastos · Los pagos de cada dos meses solo aparecen en sus meses correspondientes.</p></div>`}
function budget(){let m=month(),rs=recurFor(m).filter(x=>x.type==='expense'),ms=d.moves.filter(x=>x.date.slice(0,7)===m&&x.type==='expense'),cats=[...new Set([...rs.map(x=>x.category),...ms.map(x=>x.category)])];return `<div class="card">${cats.length?cats.map(c=>{let amount=rs.filter(x=>x.category===c).reduce((a,x)=>a+x.amount,0)+ms.filter(x=>x.category===c).reduce((a,x)=>a+x.amount,0);return `<div class="listitem"><span>${esc(c)}</span><b>${fmt(amount)}</b></div>`}).join(''):'No hay gastos este mes.'}</div>`}
function home(){let t=calc(month());return `${monthCtl()}${metrics(month())}<div class="card"><h3>Saldo inicial (opcional)</h3><form id="initialForm" class="row"><input name="initial" type="number" step=".01" value="${d.initial}" placeholder="Saldo bancario inicial"><button class="primary">Guardar</button></form><small class="muted">Este dato se guarda aparte; el balance mensual se calcula con ingresos y gastos del mes.</small></div><h3>Movimientos del mes</h3>${movesList(month())}${moveForm()}`}
function render(){nav();let app=document.querySelector('#app');if(tab==='home'){app.innerHTML=home();bindMonth()}else if(tab==='moves'){app.innerHTML=monthCtl()+moveForm()+movesList(month());bindMonth()}else if(tab==='calendar'){app.innerHTML=monthCtl()+calendarView();bindMonth()}else if(tab==='rec'){app.innerHTML=recForm()+recList()}else{app.innerHTML=monthCtl()+budget();bindMonth()}
let mf=document.querySelector('#moveForm');if(mf)mf.onsubmit=e=>{e.preventDefault();let f=new FormData(mf);d.moves.push({id:id(),type:f.get('type'),amount:Number(f.get('amount')),date:f.get('date'),category:f.get('category'),desc:f.get('desc')});save()};
let rf=document.querySelector('#recForm');if(rf)rf.onsubmit=e=>{e.preventDefault();let f=new FormData(rf),obj={id:f.get('id')||id(),name:f.get('name'),amount:Number(f.get('amount')),type:f.get('type'),category:f.get('category'),day:Number(f.get('day')),start:f.get('start'),freq:f.get('freq'),end:f.get('end')};let idx=d.rec.findIndex(x=>x.id===obj.id);if(idx>=0)d.rec[idx]=obj;else d.rec.push(obj);save()};
let init=document.querySelector('#initialForm');if(init)init.onsubmit=e=>{e.preventDefault();d.initial=Number(new FormData(init).get('initial'));save()};
document.querySelectorAll('[data-editrec]').forEach(b=>b.onclick=()=>{let r=d.rec.find(x=>x.id===b.dataset.editrec);app.innerHTML=recForm(r)+recList()+backupControls();renderRecHandlers();bindBackup()});
if(tab==='rec')bindBackup();
document.querySelectorAll('[data-delr]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este pago programado?')){d.rec=d.rec.filter(x=>x.id!==b.dataset.delr);save()}});
document.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este movimiento?')){d.moves=d.moves.filter(x=>x.id!==b.dataset.delm);save()}});
document.querySelectorAll('[data-editm]').forEach(b=>b.onclick=()=>{let x=d.moves.find(x=>x.id===b.dataset.editm);openMoveEdit(x)});
}
function bindBackup(){let ex=document.querySelector('#export');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-economia-backup.json';a.click();URL.revokeObjectURL(url)};let ib=document.querySelector('#importbtn'),fi=document.querySelector('#importfile');if(ib&&fi)ib.onclick=()=>fi.click();if(fi)fi.onchange=()=>{let file=fi.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let z=JSON.parse(reader.result);if(!Array.isArray(z.rec)||!Array.isArray(z.moves))throw Error();d=z;save()}catch(e){alert('Archivo de copia no válido.')}};reader.readAsText(file)};let rs=document.querySelector('#reset');if(rs)rs.onclick=()=>{if(confirm('Esto sustituirá los pagos programados y borrará movimientos anotados. ¿Continuar?')){d={rec:base,moves:[],initial:0};save()}}}
function renderRecHandlers(){let rf=document.querySelector('#recForm');if(rf)rf.onsubmit=e=>{e.preventDefault();let f=new FormData(rf),obj={id:f.get('id')||id(),name:f.get('name'),amount:Number(f.get('amount')),type:f.get('type'),category:f.get('category'),day:Number(f.get('day')),start:f.get('start'),freq:f.get('freq'),end:f.get('end')};let ix=d.rec.findIndex(x=>x.id===obj.id);if(ix>=0)d.rec[ix]=obj;else d.rec.push(obj);save()};document.querySelector('#cancelEdit')?.addEventListener('click',render)}
function openMoveEdit(x){document.querySelector('#modal').innerHTML=`<div class="modal"><div class="modalbox"><button class="close" id="close">Cerrar</button><h3>Editar movimiento</h3><form id="editm"><div class="formgrid"><select name="type"><option value="expense" ${x.type==='expense'?'selected':''}>Gasto</option><option value="income" ${x.type==='income'?'selected':''}>Ingreso</option></select><input name="amount" type="number" step=".01" value="${x.amount}" required><input name="date" type="date" value="${x.date}" required><input name="category" value="${esc(x.category)}" required><input name="desc" class="wide" value="${esc(x.desc||'')}"></div><button class="primary" style="width:100%;margin-top:10px">Guardar</button></form></div></div>`;document.querySelector('#close').onclick=()=>document.querySelector('#modal').innerHTML='';document.querySelector('#editm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(x,{type:f.get('type'),amount:Number(f.get('amount')),date:f.get('date'),category:f.get('category'),desc:f.get('desc')});document.querySelector('#modal').innerHTML='';save()}}
render();
})();
</script>
<script>
/* Backup/restore controls inserted on the Recurring tab */
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script></body></html>
